services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: telegram_parser
      POSTGRES_USER: telegram_parser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegram_parser"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11-alpine
    depends_on:
      db:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://db:5432/telegram_parser
      - -user=telegram_parser
      - -password=${POSTGRES_PASSWORD}
      - migrate
    volumes:
      - ./migrations:/flyway/sql:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      # Внутри Docker PostgreSQL доступен по имени сервиса db и порту 5432.
      DATABASE_URL: postgresql+asyncpg://telegram_parser:${POSTGRES_PASSWORD}@db:5432/telegram_parser
      FRONTEND_ORIGINS: http://localhost:5173,http://localhost:5174
    ports:
      - "8002:8000"

volumes:
  postgres_data: